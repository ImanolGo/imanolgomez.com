# Zola configuration — https://www.getzola.org/documentation/getting-started/configuration/
# Verified against Zola 0.23.6 (the version installed). Keys below exist in that release.

base_url = "https://imanolgomez.com"
title = "Imanol Gómez"
description = "AI engineer & creative technologist — 15+ years shipping production software, from LLM agents to real-time light installations."
default_language = "en"

# The default author for pages (used by feeds).
author = "Imanol Gómez"

compile_sass = true
minify_html = true
build_search_index = false

# Feeds are off site-wide and enabled per section. In Zola 0.23 the section front
# matter key of the same name is independent of this one, so the writing section
# opts in on its own (see content/writing/_index.md).
generate_feeds = false
feed_filenames = ["atom.xml"]

# Renders /tags/ and /tags/<term>/. Taxonomy templates are required only once a
# page actually carries a tag.
taxonomies = [{ name = "tags" }]

# Link checking (`zola check`). Internal problems stay fatal; external ones are
# reported but do not fail the build, because third-party hosts rot, rate-limit
# or block automated requests (LinkedIn answers 999). LinkedIn and GitHub are
# skipped outright so `zola check` stays fast and offline-friendly-ish.
[link_checker]
external_level = "warn"
skip_prefixes = ["https://www.linkedin.com/", "https://github.com/"]

[extra]
author = "Imanol Gómez"

# Public address (on the resume header). The footer links it directly.
email = "imanol@steinergomez.com"

linkedin = "https://www.linkedin.com/in/imanolgo/"
github = "https://github.com/ImanolGo"

# Writing stays out of the navigation until it has at least one published post.
show_writing = false

# Optional Phase 9 WebAssembly hero piece.
hero_canvas = false
