# Experience, grouped by organisation, newest first. `data/*.toml` is loaded with
# `load_data` in the templates; this grouped shape keeps the CV and home timeline
# a plain double loop. Facts come from docs/PROFILE.md only.
#
# Org fields: name, note, location, roles (newest first), each with role, start,
# end ("present"), summary, highlights and an optional `project` slug that links
# to a case study in content/projects/. Optional role `team_size` powers the home
# leadership highlight; without it, the role title is shown instead.

[[org]]
name = "CARIAD"
period = "Apr 2023 – present"
note = "Volkswagen Group software company"
location = "Berlin"

[[org.roles]]
role = "Head of AI Deployment"
team_size = 12
start = "Oct 2025"
end = "present"
summary = "Leads a team of 12 engineers that takes AI models from research prototypes to production on a volume-production ADAS platform (CARIAD–Bosch Automated Driving Alliance)."
highlights = [
  "Owns production reliability, performance and auditability under ISO 26262 and ASPICE: latency, memory and power targets, release quality and traceability.",
  "Works directly with enterprise stakeholders at Volkswagen Group brands (Volkswagen, Audi) on requirements, priorities and delivery.",
  "Leads technical discussions with semiconductor partners Qualcomm, Samsung and NVIDIA on integration and performance.",
  "Drives shared tooling and automation so model teams deliver consistently across multiple platforms.",
]
skills = ["Python", "C++", "ISO 26262", "ASPICE", "team leadership"]
project = "ai-deployment-cariad"

